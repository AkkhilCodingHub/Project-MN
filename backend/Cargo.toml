[package]
name = "studytrace_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7.5", features = ["multipart"] }
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.13.4", features = ["json", "multipart", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.1", features = ["runtime-tokio", "postgres", "chrono", "uuid", "tls-native-tls"] }
pdf-extract = "0.12.0"
tower-http = { version = "0.5.2", features = ["cors"] }
dotenvy = "0.15"
chrono = { version = "0.4.38", features = ["serde"] }
uuid = { version = "1.10.0", features = ["v4", "serde"] }
futures = "0.3.30"
hex = "0.4.3"
hmac = "0.12.1"
sha2 = "0.10.8"

[profile.release]
opt-level = 3            # Optimize binary for maximum runtime speed
lto = true               # Full Link-Time Optimization (maximum runtime performance)
codegen-units = 1        # Disables parallel codegen to allow LLVM to perform global optimization passes
panic = "abort"          # Reduce binary size and speed up execution by stripping panic unwinding stack traces
strip = true             # Strip symbols and debuginfo to minimize memory usage and binary footprint

[profile.dev]
opt-level = 0
debug = "line-tables-only"          # Fast compile times (line tables only, cuts debug bloat by ~70%)
incremental = true              # Enable fast cached incremental re-compiles (<100ms)
codegen-units = 256             # Maximize CPU core parallel compilation
split-debuginfo = "unpacked"   # macOS fast compile speed boost

[profile.dev.build-override]
opt-level = 0
codegen-units = 256


