name: Auto Assign PR

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  assign:
    name: Auto Assign PR
    runs-on: ubuntu-latest
    steps:
      - name: Assign PR to Maintainers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr edit "$PR_URL" --add-assignee "akkhilcodinghub,itzshrutiiisharma"
