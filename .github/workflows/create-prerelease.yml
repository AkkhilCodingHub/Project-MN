name: Create Pre-Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Pre-release Version Tag (e.g., v0.2.0-beta.1)'
        required: true
        default: 'v0.2.0-beta.1'
      release_title:
        description: 'Release Title'
        required: true
        default: 'StudyTrace v0.2.0-beta.1 — Full-Stack RAG Engine & Glassmorphic UI'
      custom_notes:
        description: 'Custom Release Notes / Highlight Summary'
        required: false
        default: 'Pre-release deployment featuring dark-glassmorphic frontend, 3D study flashcards, grounded RAG chat engine, and optimized Rust backend.'

permissions:
  contents: write

jobs:
  create-prerelease:
    name: Build Assets & Publish GitHub Pre-Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Rust Backend Release Binary
        run: |
          cd backend
          cargo build --release
          tar -czvf ../studytrace-backend-linux-amd64.tar.gz -C target/release studytrace_backend

      - name: Build Frontend Distribution Bundle
        run: |
          cd frontend
          npm ci
          npm run build
          cd dist
          zip -r ../../studytrace-frontend-dist.zip .

      - name: Draft Comprehensive Release Notes
        id: release_notes
        run: |
          cat << 'EOF' > release_body.md
          ## 🚀 StudyTrace Pre-Release (${{ inputs.version_tag }})

          ${{ inputs.custom_notes }}

          ---

          ### ✨ Key Features & Enhancements

          #### 🎨 Modern Dark Glassmorphic Frontend
          - **Atlas Intel Visual Aesthetic**: Dark onyx palette, translucent glassmorphism surfaces (`backdrop-filter: blur`), crosshair grid motifs (`+`), and live pulsing status badges (`<span class="dot"></span>`).
          - **Grounded RAG Chat Studio**: Real-time engineering tutor query interface with KaTeX LaTeX math rendering, Markdown comparison tables, and page-by-page document citations (`SourceInfo`).
          - **Autogenerated Sessional Quiz Engine**: Vector-derived 4-option multiple-choice tests with option validation, explanations, and victory confetti animations.
          - **3D Study Flashcards Deck**: Interactive 3D flip cards for reviewing engineering terms, equations, and derivations.
          - **Pre-Loaded Subject Seeder**: Instant demo note loading for *Data Structures*, *Signals & Systems*, and *Operating Systems*.
          - **Vector Inspector & Telemetry**: Live system health metrics, 768-dimensional embedding monitoring, and database pooling status.
          - **Pro Tier Upgrade Drawer**: Razorpay subscription checkout simulation with HMAC-SHA256 signature verification logic.

          #### ⚙️ High-Performance Rust Backend
          - **Fast Axum Web Framework**: Asynchronous endpoints for `/api/ingest`, `/api/query`, `/api/quiz`, `/api/flashcards`, and `/api/webhook/razorpay`.
          - **Supabase PostgreSQL Connection Pooling**: Optimized connection parameters (`max_connections = 5`, `idle_timeout = 30s`) to prevent connection exhaustion.
          - **Gemini & Pinecone Integration**: 768-dimensional embeddings via `gemini-embedding-2`, answer synthesis via `gemini-flash-latest`, and Pinecone vector namespace isolation (`user_<user_id>`).
          - **Self-Healing JSON Parser**: Stack-based bracket balancer (`clean_json_braces`) to repair truncated LLM payloads.

          ---

          ### 📦 Pre-compiled Build Assets Attached

          - `studytrace-backend-linux-amd64.tar.gz`: Pre-compiled optimized release binary for 64-bit Linux.
          - `studytrace-frontend-dist.zip`: Production frontend SPA build ready to deploy to Vercel/Netlify.

          ---

          ### 📜 Git Commit Log
          EOF

          echo "" >> release_body.md
          echo '```' >> release_body.md
          git log -n 15 --pretty=format:"* %h - %s (%an, %ar)" >> release_body.md
          echo "" >> release_body.md
          echo '```' >> release_body.md

      - name: Publish GitHub Pre-Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.version_tag }}" \
            studytrace-backend-linux-amd64.tar.gz \
            studytrace-frontend-dist.zip \
            --title "${{ inputs.release_title }}" \
            --notes-file release_body.md \
            --prerelease \
            --target "${{ github.sha }}"
